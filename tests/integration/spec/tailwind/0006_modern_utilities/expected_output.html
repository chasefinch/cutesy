<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Modern Utilities</title>
</head>
<body>
	<div class="
		isolate
		p-6
		size-64
		bg-white
		ring-1 ring-black/5 rounded-xl
		shadow-sm inset-shadow-sm
		card-shell
	">
		<button class="
			px-4 py-2
			text-white
			bg-blue-600
			border inset-ring ring-inset focus:ring-2 focus:ring-blue-500 rounded
			shadow
			btn-primary
		">
			Ring Button
		</button>
		<img
			class="
				size-12
				object-cover
				rounded-full
				backdrop-blur blur-sm brightness-110 drop-shadow-lg grayscale hover:grayscale-0
				avatar-image
			"
			src="avatar.png"
			width="48"
			height="48"
			alt="Avatar"
		>
		<p class="
			decoration-2 italic line-clamp-3 text-gray-700 truncate underline
			text-shadow-md
			prose-body
		">
			Typography words
		</p>
		<table class="w-full border-collapse border-spacing-0 caption-top table-fixed">
			<caption class="text-sm caption-bottom">Table layout</caption>
		</table>
		<div class="
			grid
			justify-items-center
			auto-cols-fr break-inside-avoid grid-flow-col
			gap-2
			justify-self-end
			col-3 row-auto
		">
			<span class="
				box-border inline-grid invisible
				backface-hidden origin-center perspective-near rotate-x-45 transform-3d
			">3D</span>
			<textarea class="
				accent-pink-500
				appearance-none
				caret-blue-500
				field-sizing-content
				resize-none
				scheme-dark
				will-change-transform
				forced-color-adjust-none
			"></textarea>
		</div>
		<div class="
			end-0 start-0
			flex!
			-mt-2! !p-4
			hover:!bg-red-500
			mask-radial-from-50%
			legacy-container container-fluid static-page hidden-xs
		">
			Not Tailwind lookalikes and important markers
		</div>
	</div>
</body>
</html>
