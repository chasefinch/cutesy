<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Utilities</title>
</head>
<body>
    <div class="card-shell ring-1 ring-black/5 shadow-sm size-64 rounded-xl bg-white inset-shadow-sm p-6 isolate">
        <button class="btn-primary focus:ring-2 focus:ring-blue-500 ring-inset inset-ring rounded border bg-blue-600 px-4 py-2 text-white shadow">
            Ring Button
        </button>
        <img class="avatar-image grayscale hover:grayscale-0 blur-sm brightness-110 drop-shadow-lg backdrop-blur size-12 rounded-full object-cover" src="avatar.png" alt="Avatar" width="48" height="48">
        <p class="prose-body truncate italic underline decoration-2 line-clamp-3 text-shadow-md text-gray-700">
            Typography words
        </p>
        <table class="table-fixed border-collapse border-spacing-0 caption-top w-full">
            <caption class="caption-bottom text-sm">Table layout</caption>
        </table>
        <div class="grid grid-flow-col auto-cols-fr col-3 row-auto justify-self-end justify-items-center gap-2 break-inside-avoid">
            <span class="inline-grid invisible box-border transform-3d perspective-near rotate-x-45 origin-center backface-hidden">3D</span>
            <textarea class="field-sizing-content resize-none accent-pink-500 caret-blue-500 appearance-none scheme-dark will-change-transform forced-color-adjust-none"></textarea>
        </div>
        <div class="legacy-container container-fluid static-page hidden-xs flex! -mt-2! !p-4 hover:!bg-red-500 mask-radial-from-50% start-0 end-0">
            Not Tailwind lookalikes and important markers
        </div>
    </div>
</body>
</html>
